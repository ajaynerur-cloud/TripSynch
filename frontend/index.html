<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e55"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>TripSynch V7</title></head><body>
<section id="authScreen" class="shell"><h1>TripSynch</h1><p>Login before creating or joining a trip.</p><div class="switch"><button type="button" class="active" data-auth="login">Login</button><button type="button" data-auth="signup">Sign up</button></div><form id="loginForm" class="card"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" minlength="8" required><button>Login</button></form><form id="signupForm" class="card" hidden><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (minimum 8 characters)" minlength="8" required><button>Create account</button></form></section>
<section id="homeScreen" class="shell" hidden><div class="top"><div><h1>My trips</h1><p id="signedInAs"></p></div><button type="button" id="logoutHome" class="secondary">Logout</button></div><form id="createTripForm" class="card"><h2>Create trip</h2><input name="name" placeholder="Trip name" required><select name="currency"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option><option>SGD</option><option>AED</option></select><button>Create trip</button></form><form id="joinTripForm" class="card"><h2>Join trip</h2><input name="code" maxlength="8" placeholder="Invite code" required><button>Join trip</button></form><div id="tripCards"></div></section>
<section id="app" hidden><header><div><small>ACTIVE TRIP</small><h1 id="title"></h1><p id="sync"></p></div><div class="header-actions"><button type="button" id="invite">Invite</button><button type="button" id="logoutApp">Logout</button></div></header><main><div id="stats" class="stats"></div><div id="mine"></div><section id="expenses" class="panel"><article><h2>Add expense</h2><form id="expenseForm"><input name="description" placeholder="Description" required><input name="amount" type="number" min=".01" step=".01" placeholder="Amount" required><small>Date and time are recorded automatically.</small><fieldset><legend>Who paid?</legend><div id="payers" class="choices"></div></fieldset><fieldset><legend>Split among</legend><div id="splits" class="choices"></div></fieldset><button>Add expense</button></form></article><article><h2>Expenses</h2><div id="expenseList"></div></article></section><section id="people" class="panel" hidden><div id="peopleList"></div></section><section id="details" class="panel" hidden><div id="detailList"></div></section><section id="settle" class="panel" hidden><article><h2>Settle</h2><div id="settleList"></div><h2>History</h2><div id="history"></div></article></section><section id="settings" class="panel" hidden><article><button type="button" id="backTrips" class="secondary">Back to my trips</button><button type="button" id="deleteTrip" class="danger">Delete trip</button></article></section></main><nav><button data-tab="expenses" class="active">Expenses</button><button data-tab="people">People</button><button data-tab="details">Details</button><button data-tab="settle">Settle</button><button data-tab="settings">Settings</button></nav></section>
<div id="inviteOverlay" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Invite members</h2><button type="button" id="closeInviteTop" class="round">×</button></div><img id="inviteQr" alt="Invite QR"><input id="inviteLink" readonly><button type="button" id="shareInvite">Share</button><button type="button" id="copyInvite">Copy link</button><button type="button" id="closeInvite" class="secondary">Close</button></section></div><div id="toast"></div><script src="config.js"></script><script src="app.js"></script></body></html>
