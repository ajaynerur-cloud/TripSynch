<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e55"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>TripSynch V6.1</title></head><body>
<section id="welcome" class="welcome"><h1>TripSynch</h1><p>Plan together. Spend together. Settle clearly.</p><div class="mode"><button type="button" class="active" data-mode="create">Create</button><button type="button" data-mode="join">Join</button></div><form id="createForm" class="card"><h2>Create trip</h2><input name="name" placeholder="Trip name" required><input name="ownerName" placeholder="Your name" required><select name="currency"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option><option>SGD</option><option>AED</option></select><button>Create trip</button></form><form id="joinForm" class="card" hidden><h2>Join trip</h2><input name="code" maxlength="8" placeholder="Invite code" required><input name="name" placeholder="Your name" required><button>Join trip</button></form></section>
<section id="app" hidden><header><div><small>ACTIVE TRIP</small><h1 id="title"></h1><p id="sync"></p></div><button type="button" id="invite">Invite</button></header><main><div id="stats" class="stats"></div><div id="mine"></div><section id="expenses" class="panel"><article class="card"><h2>Add expense</h2><form id="expenseForm"><input name="description" placeholder="Description" required><input name="amount" type="number" step=".01" min=".01" inputmode="decimal" placeholder="Amount" required><small>Date and time are recorded automatically.</small><fieldset><legend>Who paid?</legend><div id="payers" class="choices"></div></fieldset><fieldset><legend>Split among</legend><div id="splits" class="choices"></div></fieldset><button>Add expense</button></form></article><article class="card"><h2>Expenses</h2><div id="expenseList"></div></article></section><section id="people" class="panel" hidden><div id="peopleList"></div></section><section id="details" class="panel" hidden><div id="detailList"></div></section><section id="settle" class="panel" hidden><article class="card"><h2>Settle</h2><div id="settleList"></div><h2>Settlement history</h2><div id="history"></div></article></section><section id="settings" class="panel" hidden><article class="card"><button type="button" id="leave" class="secondary">Leave this device</button><button type="button" id="end" class="danger">Delete trip</button></article></section></main><nav><button type="button" data-tab="expenses" class="active">Expenses</button><button type="button" data-tab="people">People</button><button type="button" data-tab="details">Details</button><button type="button" data-tab="settle">Settle</button><button type="button" data-tab="settings">Settings</button></nav></section>
<dialog id="inviteDialog" aria-labelledby="inviteDialogTitle"><div class="dialog-head"><h2 id="inviteDialogTitle">Invite members</h2><button type="button" id="closeInviteDialogTop" class="icon-close" aria-label="Close invite dialog">×</button></div><img id="inviteQr" alt="Invite QR code"><label>Invite link<input id="inviteLink" readonly></label><button type="button" id="shareInvite">Share invite</button><button type="button" id="copyInvite">Copy link</button><button type="button" id="closeInviteDialog" class="secondary">Close</button></dialog>
<div id="toast" role="status"></div><script src="config.js"></script><script src="app.js"></script></body></html>
