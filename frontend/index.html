<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#075e55"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>TripSynch</title></head><body>
<section id="welcome" class="welcome-screen"><div class="logo">TS</div><h1>TripSynch</h1><p>Create a trip or join with an invite code.</p><div class="switch"><button class="active" data-mode="create">Create</button><button data-mode="join">Join</button></div><article id="createPanel" class="card"><h2>Create trip</h2><form id="createForm"><input name="name" placeholder="Trip name" required><input name="ownerName" placeholder="Your name" required><select name="currency"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option><option>SGD</option><option>AED</option></select><button>Create and continue</button></form></article><article id="joinPanel" class="card" hidden><h2>Join trip</h2><form id="joinForm"><input name="code" maxlength="8" placeholder="Invite code" required><input name="name" placeholder="Your name" required><button>Join trip</button></form></article></section>
<section id="tripView" hidden><header class="appbar"><div><small>ACTIVE TRIP</small><h1 id="tripName"></h1><p id="sync"></p></div><button id="invite">Invite</button></header><main><div id="stats" class="stats"></div><section id="myPosition"></section><section id="expenses" class="panel"><article class="card"><h2>Add expense</h2><form id="expenseForm"><input name="description" placeholder="Description" required><input name="amount" type="number" min=".01" step=".01" placeholder="Amount" required><fieldset><legend>Who paid?</legend><div id="paidByRadios" class="payer-radios"></div></fieldset><fieldset><legend>Split among</legend><div id="splitMembers" class="checks"></div></fieldset><button>Add expense</button></form></article><article class="card"><h2>Recent expenses</h2><div id="expenseList"></div></article></section><section id="people" class="panel" hidden><div id="personCards" class="detailgrid"></div></section><section id="breakdown" class="panel" hidden><div id="breakdownList"></div></section><section id="settle" class="panel" hidden><article class="card"><h2>Payment plan</h2><div id="settlementList"></div></article></section><section id="admin" class="panel" hidden><article class="card"><h2>Trip settings</h2><button id="leave" class="secondary">Leave device</button><button id="endTrip" class="danger">End and delete trip</button></article></section></main><nav><button data-tab="expenses" class="active"><b>＋</b>Expenses</button><button data-tab="people"><b>◎</b>People</button><button data-tab="breakdown"><b>≡</b>Details</button><button data-tab="settle"><b>₹</b>Settle</button><button data-tab="admin"><b>⚙</b>Settings</button></nav></section>
<dialog id="inviteDialog"><h2>Invite</h2><img id="qr"><input id="inviteLink" readonly><button id="copyInvite">Copy link</button><button id="closeInvite" class="secondary">Close</button></dialog><div id="toast"></div><script src="config.js"></script><script src="app.js"></script><script>document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));createPanel.hidden=b.dataset.mode!=='create';joinPanel.hidden=b.dataset.mode!=='join'})</script></body></html>
