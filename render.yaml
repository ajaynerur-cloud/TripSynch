services:
  - type: web
    name: tripsynch
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: DATA_PATH
        value: data/store.json
      - key: PUBLIC_APP_URL
        value: https://tripsynch.onrender.com
